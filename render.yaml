services:
  - type: web
    name: showmyfleet-backend
    env: python
    region: ohio
    plan: starter # You can choose other plans like standard, pro, etc.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: showmyfleet-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "https://showmyfleet.vercel.app"
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: showmyfleet-db
    region: ohio
    plan: starter # Recommended for production, free tier has limited connections/compute
    databaseName: fleet_db
    user: fleet_user
